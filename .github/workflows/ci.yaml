name: ci

on:
  push:
    branches: [main, caprover]
  pull_request:
    branches: [main, caprover]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://ci:ci-password@127.0.0.1:3306/mailgun_ci
  DASHBOARD_JWT_SECRET: ci-dashboard-session-signing-secret-not-for-production
  API_KEY: ci-api-key

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npm run test:retention-link-helper
      - run: docker build --file dockerfile --tag mailgun-ses-proxy-ci .
      - name: Smoke-test final production image
        run: |
          evidence_root="$RUNNER_TEMP/newsletter-retention-link-helper"
          mkdir -p "$evidence_root"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint bun \
            --env NEWSLETTER_RETENTION_REQUIRE_IMAGE_HELPER=1 \
            --env NEWSLETTER_RETENTION_LINK_HELPER_TEST_ROOT=/evidence \
            --env DATABASE_URL=mysql://localhost:3306/dummy \
            --volume "$evidence_root:/evidence" \
            mailgun-ses-proxy-ci \
            scripts/test-newsletter-retention-link-helper.mjs
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high

  bun-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:run
      - run: bun run build
      - run: bun scripts/test-newsletter-retention-link-helper.mjs

  mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: mailgun_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:analytics-index-migration
        env:
          CI_DB_HOST: 127.0.0.1
          CI_DB_ROOT_PASSWORD: ci-root-password
      - run: npm run test:ci:db
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('artifacts/vitest-report.json') != '' }}
        with:
          name: mysql-vitest-report
          path: artifacts/vitest-report.json
          if-no-files-found: error

  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: mailgun_ci
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci-password
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:analytics-index-migration
        env:
          CI_DB_HOST: 127.0.0.1
          CI_DB_ROOT_PASSWORD: ci-root-password
      - run: npm run test:ci:db
      - name: Smoke-test final image HTTP bootstrap contract
        run: |
          image=mailgun-ses-proxy-http-smoke
          container=mailgun-ses-proxy-http-smoke-$RANDOM
          response_file="$RUNNER_TEMP/$container.healthcheck.json"
          docker build --file dockerfile --tag "$image" .
          docker run --detach --name "$container" --network host \
            --env DATABASE_URL=mysql://ci:ci-password@127.0.0.1:3306/mailgun_ci \
            --env API_KEY=ci-api-key \
            --env DASHBOARD_JWT_SECRET=ci-dashboard-session-signing-secret-not-for-production \
            --env AWS_EC2_METADATA_DISABLED=true \
            --env AWS_ACCESS_KEY_ID=ci-access-key \
            --env AWS_SECRET_ACCESS_KEY=ci-secret-key \
            --env SES_REGION=us-east-1 \
            --env SQS_REGION=us-east-1 \
            --env NEWSLETTER_QUEUE=https://sqs.us-east-1.amazonaws.com/000000000000/newsletter \
            --env NEWSLETTER_NOTIFICATION_QUEUE=https://sqs.us-east-1.amazonaws.com/000000000000/newsletter-notifications \
            --env TRANSACTIONAL_NOTIFICATION_QUEUE=https://sqs.us-east-1.amazonaws.com/000000000000/transactional-notifications \
            --env PORT=3000 \
            "$image"
          docker exec "$container" node --version
          docker exec "$container" bun --version
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --max-time 3 http://127.0.0.1:3000/healthcheck || true)
            if [ "$status" = 200 ] || [ "$status" = 503 ]; then
              node -e "const fs=require('fs'); const health=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); const status=Number(process.argv[2]); const validReady=health.ready === true && ['ok','degraded'].includes(health.status); const validUnready=health.ready === false && health.status === 'unhealthy'; if ((status === 200 && !validReady) || (status === 503 && !validUnready) || (status !== 200 && status !== 503)) process.exit(1);" "$response_file" "$status"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" != true ]; then
              echo 'final image exited before serving healthcheck; CI-only synthetic-runtime logs follow' >&2
              docker logs --tail 50 "$container" >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo 'final image did not serve a non-500 healthcheck within 30 seconds; CI-only synthetic-runtime logs follow' >&2
          docker logs --tail 50 "$container" >&2 || true
          exit 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && hashFiles('artifacts/vitest-report.json') != '' }}
        with:
          name: mariadb-vitest-report
          path: artifacts/vitest-report.json
          if-no-files-found: error
